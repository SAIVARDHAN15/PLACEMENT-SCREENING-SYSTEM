# PostgreSQL Database Configuration
# CORRECTED: The URL must start with "jdbc:"
spring.datasource.url=jdbc:postgresql://localhost:5432/placement-system-db
spring.datasource.username=postgres
spring.datasource.password=Vardhan@2003
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Spring Boot's automatic Docker management to prevent conflicts
spring.docker.compose.enabled=false