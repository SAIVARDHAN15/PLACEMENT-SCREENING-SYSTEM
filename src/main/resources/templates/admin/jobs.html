<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Jobs</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="container">
    <h1>All Job Postings</h1>
    <table class="styled-table">
        <thead>
        <tr>
            <th>Job Title</th>
            <th>Company</th>
            <th>Package (LPA)</th>
            <th>CGPA Criteria</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="job : ${jobPostings}">
            <td th:text="${job.jobTitle}"></td>
            <td th:text="${job.company.name}"></td>
            <td th:text="${job.packageOffered}"></td>
            <td th:text="${job.cgpaCriteria}"></td>
        </tr>
        </tbody>
    </table>
    <div style="text-align: center; margin-top: 30px;">
        <a th:href="@{/admin}" class="back-link">Back to Admin Dashboard</a>
    </div>
</div>
</body>
</html>
